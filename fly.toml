# Fly.io config for Mindgrove: the PWA plus end-to-end encrypted sync.
# The server only stores ciphertext blobs (one small file per synced grove) on
# the mindgrove_data volume, so the app must stay on a single machine.
app = "mindgrove"
primary_region = "jnb"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "mindgrove_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when idle and wakes on the next request (the first one takes ~1-2 s).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
