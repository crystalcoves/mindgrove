# Fly.io config for Mindgrove — a static PWA served by nginx.
# All user data lives in the browser (IndexedDB), so the machine is stateless:
# no volume, and it can sleep when idle and wake on the next request.
app = "mindgrove"
primary_region = "jnb"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Stateless static site: stop when idle to keep cost near zero.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/manifest.webmanifest"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
